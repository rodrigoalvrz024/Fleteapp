name: muvv_app
description: App de fletes para Chile
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP y almacenamiento
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^13.2.0

  # Mapas y geolocalización
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0

  # Firebase — versiones compatibles con Xcode 26
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^7.2.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

