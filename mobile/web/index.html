<!DOCTYPE html>
<html lang="es-CL">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App operacional de Muvv para solicitar, aceptar, monitorear y cerrar fletes urbanos con respaldo.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#2563EB">
  <meta property="og:title" content="Muvv | App operacional">
  <meta property="og:description" content="Solicita fletes, acepta viajes, registra evidencia, confirma entregas y revisa historial desde Muvv.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fleteapp-8d8f7.web.app">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Muvv | App operacional">
  <meta name="twitter:description" content="App privada para clientes, conductores y administracion operacional de Muvv.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Muvv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Muvv | App operacional</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="config.js"></script>
  <script>
    window.MUVV_GOOGLE_MAPS_API_KEY =
      window.MUVV_GOOGLE_MAPS_API_KEY ||
      '{{GOOGLE_MAPS_API_KEY}}';
    if (window.MUVV_GOOGLE_MAPS_API_KEY.startsWith('{{')) {
      window.MUVV_GOOGLE_MAPS_API_KEY = '';
    }

    function bootFlutter() {
      var flutterBootstrap = document.createElement('script');
      flutterBootstrap.src = 'flutter_bootstrap.js?v=' + Date.now();
      flutterBootstrap.async = true;
      document.body.appendChild(flutterBootstrap);
    }

    var googleMapsApiKey = window.MUVV_GOOGLE_MAPS_API_KEY;

    if (googleMapsApiKey) {
      var googleMapsScript = document.createElement('script');
      googleMapsScript.src = 'https://maps.googleapis.com/maps/api/js?key='
        + encodeURIComponent(googleMapsApiKey)
        + '&libraries=places&loading=async';
      googleMapsScript.async = true;
      googleMapsScript.defer = true;
      googleMapsScript.onload = bootFlutter;
      googleMapsScript.onerror = function () {
        console.warn('Google Maps JavaScript API could not be loaded.');
        bootFlutter();
      };
      document.head.appendChild(googleMapsScript);
    } else {
      console.warn('Missing MUVV_GOOGLE_MAPS_API_KEY in web/config.js.');
      bootFlutter();
    }
  </script>
</body>
</html>
