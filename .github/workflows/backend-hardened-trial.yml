name: Hardened runtime evaluation (not release approval)

on:
  push:
    branches:
      - codex/mvp-supabase-rls-review
    paths:
      - backend/Dockerfile.hardened
      - .github/workflows/backend-hardened-trial.yml
      - scripts/inspect-hardened-findings.py
      - backend/tests/test_hardened_finding_evidence.py
      - scripts/verify-runtime-image.py
      - scripts/report-native-symbols.py
      - scripts/native-audit-requirements.txt

permissions:
  contents: read

concurrency:
  group: hardened-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require read-only registry access
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DHI_USERNAME" || -z "$DHI_TOKEN" ]]; then
            printf '::error::Evaluation blocked: configure DHI_USERNAME and DHI_READ_TOKEN repository secrets. No image tested or release approved.\n'
            exit 1
          fi

      - name: Checkout without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull and build using temporary read-only registry credentials
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP}/muvv-dhi-auth.XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
          docker pull dhi.io/python:3.11-debian13-dev
          docker pull dhi.io/python:3.11-debian13
          declare -A images
          for role in build runtime; do
            tag='dhi.io/python:3.11-debian13'
            if [[ "$role" = build ]]; then tag="${tag}-dev"; fi
            digest="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$digest" =~ ^dhi\.io/python@sha256:[0-9a-f]{64}$ ]]
            images[$role]="$digest"
            printf 'Resolved %s base: `%s`\n' "$role" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          docker build --file backend/Dockerfile.hardened \
            --build-arg "PYTHON_BUILD_IMAGE=${images[build]}" \
            --build-arg "PYTHON_RUNTIME_IMAGE=${images[runtime]}" \
            --tag muvv-backend:hardened-trial backend
          docker image inspect muvv-backend:hardened-trial --format 'Trial image: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify dependency consistency and real privilege guard
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --pids-limit 32 \
            --entrypoint python muvv-backend:hardened-trial -B -c \
            'import os,sys; from app.server import enforce_runtime_security; assert sys.version_info[:3] == (3,11,16); enforce_runtime_security(); assert os.geteuid() == 65532; print("Real startup privilege guard passed")'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 \
            --entrypoint python muvv-backend:hardened-trial -m pip check

      - name: Run application and security regression suite offline
        run: |
          set -euo pipefail
          test_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --env APP_ENV=test --env RUN_STARTUP_MIGRATIONS=false \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/muvv_test \
            --env "SECRET_KEY=$test_key" --env ACCESS_TOKEN_EXPIRE_MINUTES=1440 \
            --env PYTHONPATH=/app \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/backend/tests,dst=/workspace/backend/tests,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts,dst=/workspace/scripts,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/backend/alembic,dst=/workspace/backend/alembic,readonly" \
            --workdir /workspace/backend --entrypoint python muvv-backend:hardened-trial \
            -B -m unittest discover -s tests

      - name: Check bounded Python regressions in the trial
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --cap-drop ALL --memory 256m --cpus 1 \
            --security-opt no-new-privileges --pids-limit 32 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts/verify-python-backports.py,dst=/python-backport-check.py,readonly" \
            --entrypoint python muvv-backend:hardened-trial -I -B /python-backport-check.py --github-annotation

      - name: Verify DHI filesystem permissions without read-only masking
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts/verify-runtime-image.py,dst=/runtime-check.py,readonly" \
            --entrypoint python muvv-backend:hardened-trial -B /runtime-check.py --profile dhi --github-annotation

      - name: Verify real DHI startup and shutdown without hosting privilege flags
        run: |
          set -euo pipefail
          test_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          container="$(docker run --detach --network none --read-only --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --env APP_ENV=test --env RUN_STARTUP_MIGRATIONS=false --env PORT=18080 \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/muvv_test \
            --env "SECRET_KEY=$test_key" --env ACCESS_TOKEN_EXPIRE_MINUTES=1440 \
            muvv-backend:hardened-trial)"
          trap 'docker rm --force "$container" > /dev/null 2>&1 || true' EXIT
          docker exec --interactive "$container" python -B - <<'PY'
          import json
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:18080'
          for attempt in range(100):
              try:
                  with urllib.request.urlopen(base + '/', timeout=1) as response:
                      assert response.status == 200
                      assert json.load(response)['status'] == 'ok'
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.1)
          else:
              raise SystemExit('Candidate startup did not become ready')
          command = Path('/proc/1/cmdline').read_bytes().split(b'\0')
          assert command[:3] == [b'/opt/muvv-venv/bin/python', b'-m', b'app.server'], 'Unexpected PID 1'
          status = dict(line.split(':', 1) for line in Path('/proc/1/status').read_text().splitlines() if ':' in line)
          assert int(status['NoNewPrivs'].strip()) == 1, 'Startup did not disable new privileges'
          for field in ('CapInh', 'CapPrm', 'CapEff', 'CapAmb'):
              assert int(status[field].strip(), 16) == 0, 'Server has process capabilities'
          for field in ('Uid', 'Gid', 'Groups'):
              assert 0 not in map(int, status[field].split()), 'Server has a root identity'
          for route in ('/users/me', '/drivers/me', '/admin/users'):
              for headers in ({}, {'Authorization': 'Bearer invalid-test-token'}):
                  try:
                      urllib.request.urlopen(urllib.request.Request(base + route, headers=headers), timeout=2)
                  except urllib.error.HTTPError as error:
                      assert error.code == 401, (route, error.code)
                  else:
                      raise AssertionError('Protected route accepted unauthenticated access')
          print('::notice title=DHI startup checks::Real CMD, PID 1, no_new_privs, zero process capabilities and six unauthenticated-route checks passed without hosting privilege flags')
          PY
          docker exec "$container" python -B -m alembic heads
          docker stop --time 10 "$container" > /dev/null
          exit_code="$(docker inspect "$container" --format '{{.State.ExitCode}}')"
          case "$exit_code" in
            0|143) ;;
            *) exit 1 ;;
          esac
          shutdown_log="$(docker logs "$container" 2>&1)"
          [[ "$shutdown_log" == *"Application shutdown complete."* ]]
          printf '::notice title=DHI shutdown check::Server stopped cleanly on SIGTERM\n'

      - name: Verify DHI startup refuses a root hosting configuration
        run: |
          set -euo pipefail
          set +e
          output="$(timeout --signal=TERM --kill-after=5s 15s docker run --rm \
            --network none --read-only --cap-drop ALL --user 0:0 --pids-limit 32 \
            muvv-backend:hardened-trial 2>&1)"
          code=$?
          set -e
          test "$code" -eq 1
          test "$output" = '[startup] Security checks failed; server not started.'
          printf '::notice title=DHI root rejection::Actual container CMD refused UID 0 before importing the application\n'

      - name: Inspect complete DHI native filesystem without executing its files
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/muvv-dhi-native.XXXXXX")"
          python3 -m venv "$audit_dir/venv"
          "$audit_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps -r scripts/native-audit-requirements.txt
          image_id="$(docker image inspect muvv-backend:hardened-trial --format '{{.Id}}')"
          container="$(docker create --network none "$image_id")"
          trap 'docker rm "$container" > /dev/null 2>&1 || true' EXIT
          docker export --output "$audit_dir/rootfs.tar" "$container"
          mkdir -p "$RUNNER_TEMP/dhi-native-symbol-evidence"
          timeout --signal=TERM --kill-after=5s 180s "$audit_dir/venv/bin/python" \
            scripts/report-native-symbols.py "$audit_dir/rootfs.tar" --image-id "$image_id" \
            --output "$RUNNER_TEMP/dhi-native-symbol-evidence/report.json" --summary "$GITHUB_STEP_SUMMARY" --github-annotation

      - name: Preserve DHI native metadata only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhi-native-symbol-evidence
          path: ${{ runner.temp }}/dhi-native-symbol-evidence/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan full trial without VEX suppressions or ignored matches
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/muvv-dhi-audit.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz \
            --output "$audit_dir/grype.tar.gz"
          printf '%s  %s\n' '1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2' "$audit_dir/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$audit_dir/grype.tar.gz" --directory "$audit_dir" grype
          image_id="$(docker image inspect muvv-backend:hardened-trial --format '{{.Id}}')"
          "$audit_dir/grype" "docker:${image_id}" --config scripts/grype-candidate.yaml \
            --output json > "$audit_dir/report.json"
          python3 scripts/inspect-hardened-findings.py "$audit_dir/report.json" --image-id "$image_id"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m --cpus 1 --pids-limit 32 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts/inspect-hardened-findings.py,dst=/evidence.py,readonly" \
            --entrypoint python muvv-backend:hardened-trial -I -B /evidence.py --runtime --image-id "$image_id"
          python3 scripts/report-image-audit.py "$audit_dir/report.json" \
            --image-id "$image_id" --summary "$GITHUB_STEP_SUMMARY" --github-annotation

      - name: State evaluation limits
        if: always()
        run: |
          printf '%s\n' 'Evaluation only: no image push, deployment, production data or release approval.' \
            'Before adoption: verify publisher signatures/provenance, full runtime permissions, real HTTP/SIGTERM, XML trace, private-storage/database TLS and target hosting compatibility.' \
            >> "$GITHUB_STEP_SUMMARY"
