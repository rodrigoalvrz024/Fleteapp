name: DHI provenance evidence (not release approval)

on:
  push:
    branches:
      - codex/mvp-supabase-rls-review
    paths:
      - .github/workflows/backend-dhi-provenance.yml
      - .github/tests/test_dhi_provenance_config.py

permissions:
  contents: read

concurrency:
  group: dhi-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind signed provenance to the fixed candidate platform manifests
        id: evidence
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$DHI_USERNAME" || -z "$DHI_TOKEN" ]]; then
            printf '::error::Read-only DHI credentials are required; no evidence verified.\n'
            exit 1
          fi
          work="$(mktemp -d "${RUNNER_TEMP}/muvv-provenance.XXXXXX")"
          export DOCKER_CONFIG="$work/auth"
          mkdir -p "$DOCKER_CONFIG" "$work/tool" "$work/evidence"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            --proto '=https' --proto-redir '=https' \
            https://github.com/docker/scout-cli/releases/download/v1.24.0/docker-scout_1.24.0_linux_amd64.tar.gz \
            --output "$work/scout.tar.gz"
          printf '%s  %s\n' 'f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b' "$work/scout.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$work/scout.tar.gz" --directory "$work/tool" docker-scout
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            --proto '=https' --proto-redir '=https' \
            https://registry.scout.docker.com/keyring/dhi/latest.pub --output "$work/dhi.pub"
          printf '%s  %s\n' '1d02bbccf149283ae6288d96264dcad3fb23ee1911d90324a48eab28e4cb8a5f' "$work/dhi.pub" | sha256sum --check --strict
          # Scout authenticates its backend via Docker Hub as well as the DHI registries.
          for registry in docker.io dhi.io registry.scout.docker.com; do
            printf '%s' "$DHI_TOKEN" | timeout 30s docker login "$registry" \
              --username "$DHI_USERNAME" --password-stdin > "$work/login.log" 2>&1 || {
              printf '::error::Registry authentication failed; credentials and logs withheld.\n'
              exit 1
            }
          done
          unset DHI_TOKEN DHI_USERNAME
          failed=0
          for role in build runtime; do
            if [[ "$role" = build ]]; then
              digest='a7bb712353136de87ec96d2c2d15de48852031aeda75be9196f2ca1825a27766'
            else
              digest='9a9fd7ffe996f9042cca4a2c0d167076a55b650cbd45a8bc535d9ab7d8ca2217'
            fi
            ref="registry://dhi.io/python@sha256:$digest"
            if ! timeout --signal=TERM --kill-after=5s 60s docker buildx imagetools inspect \
              "dhi.io/python@sha256:$digest" --format '{{json .Manifest}}' \
              > "$work/$role-index.json" 2> "$work/$role-index.log"; then
              printf '::error::%s index lookup failed; raw output withheld.\n' "$role"
              failed=1
              continue
            fi
            # DHI documents key verification without Rekor. Never claim tlog verification.
            if timeout --signal=TERM --kill-after=5s 120s "$work/tool/docker-scout" attest get \
              "$ref" --platform linux/amd64 --predicate-type https://slsa.dev/provenance/v0.2 \
              --verify --skip-tlog --key "$work/dhi.pub" --output "$work/$role.json" \
              > "$work/$role.log" 2>&1; then
              if python3 - "$work/$role.json" "$work/$role-index.json" "$digest" <<'PY'
          import json, pathlib, re, sys
          def load(path):
              path = pathlib.Path(path)
              if not path.is_file() or not 0 < path.stat().st_size <= 16 * 1024 * 1024:
                  raise ValueError("Invalid evidence size")
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("Duplicate key")
                      result[key] = value
                  return result
              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique)
          try:
              data, index = load(sys.argv[1]), load(sys.argv[2])
              requested = sys.argv[3]
              index_types = ("application/vnd.oci.image.index.v1+json",
                             "application/vnd.docker.distribution.manifest.list.v2+json")
              manifest_types = ("application/vnd.oci.image.manifest.v1+json",
                                "application/vnd.docker.distribution.manifest.v2+json")
              if (not re.fullmatch(r"[0-9a-f]{64}", requested)
                      or index.get("digest") != "sha256:" + requested
                      or index.get("schemaVersion") != 2 or index.get("mediaType") not in index_types):
                  raise ValueError("Index identity mismatch")
              platforms = [m for m in index["manifests"]
                           if m.get("platform", {}).get("os") == "linux"
                           and m.get("platform", {}).get("architecture") == "amd64"]
              if (len(platforms) != 1 or platforms[0].get("mediaType") not in manifest_types
                      or platforms[0].get("platform", {}).get("variant") not in (None, "")
                      or platforms[0].get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"):
                  raise ValueError("Ambiguous platform")
              platform = platforms[0]["digest"]
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", platform):
                  raise ValueError("Invalid platform digest")
              valid = (isinstance(data, dict) and data.get("_type") == "https://in-toto.io/Statement/v1"
                       and data.get("predicateType") == "https://slsa.dev/provenance/v0.2"
                       and isinstance(data.get("subject"), list) and 1 <= len(data["subject"]) <= 64
                       and all(isinstance(s.get("name"), str) and 0 < len(s["name"]) <= 2048
                               and s.get("digest", {}).get("sha256") == platform.removeprefix("sha256:")
                               for s in data["subject"])
                       and isinstance(data.get("predicate"), dict)
                       and isinstance(data["predicate"].get("materials"), list)
                       and bool(data["predicate"]["materials"]))
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              valid = False
          if valid:
              print("Verified signature subject matches requested index's linux/amd64 manifest: " + platform)
          raise SystemExit(0 if valid else 1)
          PY
              then
                cp "$work/$role.json" "$work/evidence/$role-provenance.json"
                cp "$work/$role-index.json" "$work/evidence/$role-index.json"
                printf '%s: Scout signature and index-to-linux/amd64 subject binding passed for sha256:%s.\n' "$role" "$digest" >> "$GITHUB_STEP_SUMMARY"
              else
                printf '::error::%s provenance structure is not the expected reviewed format.\n' "$role"
                failed=1
              fi
            else
              verify_status=$?
              python3 - "$work/$role.log" "$verify_status" <<'DIAGNOSTIC'
          import pathlib, sys
          # Never echo tool output: even error messages can contain credential-bearing URLs.
          status = int(sys.argv[2])
          with pathlib.Path(sys.argv[1]).open("rb") as stream:
              message = stream.read(1024 * 1024).decode("utf-8", errors="replace").lower()
          patterns = {
              "cli_usage": ("unknown command", "unknown flag", "requires at least", "accepts "),
              "authentication": ("unauthorized", "authentication required", "please login", "please log in", "not logged in", "docker login"),
              "authorization": ("forbidden", "access denied", "insufficient_scope"),
              "missing_evidence": ("no attestation", "manifest unknown", "not found"),
              "signature": ("no matching signatures", "verification failed", "invalid signature"),
              "key": ("loading public key", "parsing key", "pem block"),
              "network": ("connection refused", "no such host", "timeout", "tls handshake"),
              "docker_daemon": ("cannot connect to the docker daemon",),
              "plugin_invocation": ("docker cli plugin", "standalone"),
          }
          categories = [name for name, terms in patterns.items() if any(term in message for term in terms)]
          if status in (124, 137):
              categories.append("process_timeout")
          print("Verifier diagnostic: exit=" + str(status) + "; categories=" + (",".join(categories) or "unclassified") + "; raw output withheld.")
          DIAGNOSTIC
              printf '::error::%s provenance verification failed or timed out; no approval.\n' "$role"
              failed=1
            fi
          done
          printf 'directory=%s\n' "$work/evidence" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            'Evidence only. Docker public key pinned; Rekor transparency log not verified (documented DHI mode).' \
            'Package provenance, patch-to-binary binding and CVE regressions remain required; see per-role subject/platform binding results above.' \
            'No vulnerability waived, no image rebuilt or deployed, no APK or production data accessed.' >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Preserve only verified public provenance documents
        if: ${{ always() && steps.evidence.outputs.directory != '' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhi-base-provenance-evidence
          path: |
            ${{ steps.evidence.outputs.directory }}/*-provenance.json
            ${{ steps.evidence.outputs.directory }}/*-index.json
          if-no-files-found: warn
          retention-days: 14
