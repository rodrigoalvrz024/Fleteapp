name: Backend Linux candidate (no deploy)

on:
  push:
    branches:
      - codex/mvp-supabase-rls-review
    paths:
      - backend/**
      - scripts/**
      - .github/workflows/backend-linux-candidate.yml

permissions:
  contents: read

concurrency:
  group: backend-linux-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image only
        run: docker build --pull --tag muvv-backend:candidate backend

      - name: Verify non-root image and dependency consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect muvv-backend:candidate --format '{{.Config.User}}')" = app
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --entrypoint python muvv-backend:candidate -m pip check

      - name: Test candidate without external connectivity or real credentials
        shell: bash
        run: |
          set -euo pipefail
          test_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --env APP_ENV=test \
            --env RUN_STARTUP_MIGRATIONS=false \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/muvv_test \
            --env "SECRET_KEY=$test_key" \
            --env ACCESS_TOKEN_EXPIRE_MINUTES=1440 \
            --env PYTHONPATH=/app \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/backend/tests,dst=/workspace/backend/tests,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts,dst=/workspace/scripts,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/backend/alembic,dst=/workspace/backend/alembic,readonly" \
            --workdir /workspace/backend \
            --entrypoint python muvv-backend:candidate -B -m unittest discover -s tests

      - name: Verify runtime permissions without a read-only filesystem masking them
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/scripts/verify-runtime-image.py,dst=/runtime-check.py,readonly" \
            --entrypoint python muvv-backend:candidate -B /runtime-check.py --github-annotation

      - name: Smoke test the real startup command and protected routes
        shell: bash
        run: |
          set -euo pipefail
          test_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          container="$(docker run --detach --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --env APP_ENV=test --env RUN_STARTUP_MIGRATIONS=false --env PORT=18080 \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/muvv_test \
            --env "SECRET_KEY=$test_key" --env ACCESS_TOKEN_EXPIRE_MINUTES=1440 \
            muvv-backend:candidate)"
          trap 'docker rm --force "$container" > /dev/null 2>&1 || true' EXIT
          docker exec --interactive "$container" python -B - <<'PY'
          import json
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:18080'
          for attempt in range(100):
              try:
                  with urllib.request.urlopen(base + '/', timeout=1) as response:
                      assert response.status == 200
                      assert json.load(response)['status'] == 'ok'
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.1)
          else:
              raise SystemExit('Candidate startup did not become ready')
          assert Path('/proc/1/comm').read_text().strip() == 'python', 'Server is not PID 1'
          for route in ('/users/me', '/drivers/me', '/admin/users'):
              for headers in ({}, {'Authorization': 'Bearer invalid-test-token'}):
                  try:
                      urllib.request.urlopen(urllib.request.Request(base + route, headers=headers), timeout=2)
                  except urllib.error.HTTPError as error:
                      assert error.code == 401, (route, error.code)
                  else:
                      raise AssertionError('Protected route accepted unauthenticated access')
          print('::notice title=Runtime startup checks::Real CMD, PID 1 and six unauthenticated-route checks passed')
          PY
          docker exec "$container" python -B -m alembic heads
          docker stop --time 10 "$container" > /dev/null
          exit_code="$(docker inspect "$container" --format '{{.State.ExitCode}}')"
          case "$exit_code" in
            0|143) ;;
            *) exit 1 ;;
          esac
          shutdown_log="$(docker logs "$container" 2>&1)"
          [[ "$shutdown_log" == *"Application shutdown complete."* ]]
          printf '::notice title=Runtime shutdown check::Server stopped cleanly on SIGTERM\n'

      - name: Record image identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'Candidate commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect muvv-backend:candidate --format 'Image: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
          runtime_info="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --entrypoint python muvv-backend:candidate -c \
            'import json, pyexpat, sys, zlib; print(json.dumps({"python": sys.version.split()[0], "expat": pyexpat.EXPAT_VERSION, "zlib": zlib.ZLIB_RUNTIME_VERSION}))')"
          printf '::notice title=Image runtime versions::%s\n' "$runtime_info"
          printf 'Runtime versions: %s\n' "$runtime_info" >> "$GITHUB_STEP_SUMMARY"
          printf 'No image push, Railway deploy, external payment or production database access.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan OS and Python packages in the tested image
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/muvv-image-audit.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            https://github.com/anchore/grype/releases/download/v0.118.0/grype_0.118.0_linux_amd64.tar.gz \
            --output "$audit_dir/grype.tar.gz"
          printf '%s  %s\n' '1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2' "$audit_dir/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$audit_dir/grype.tar.gz" --directory "$audit_dir" grype
          image_id="$(docker image inspect muvv-backend:candidate --format '{{.Id}}')"
          "$audit_dir/grype" "docker:${image_id}" \
            --config scripts/grype-candidate.yaml --output json > "$audit_dir/report.json"
          python3 scripts/report-image-audit.py "$audit_dir/report.json" \
            --image-id "$image_id" --summary "$GITHUB_STEP_SUMMARY" --github-annotation
